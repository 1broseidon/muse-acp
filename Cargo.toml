[package]
name = "muse-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Muse Code over the Agent Client Protocol: an ACP agent that drives `muse serve`"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1broseidon/muse-acp"
keywords = ["acp", "agent", "muse", "zed", "hotline"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
agent-client-protocol = { version = "=2.0.0", features = ["unstable_auth_methods", "unstable_end_turn_token_usage"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "io-std", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
uuid = { version = "1.26.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time", "test-util"] }
