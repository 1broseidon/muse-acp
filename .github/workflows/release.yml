# Build muse-acp for every platform the ACP registry lists, then publish one
# GitHub release with an archive per platform and their checksums. A manual
# run builds and keeps the archives as workflow artifacts without releasing.
#
# The archives are what an ACP registry entry points at: muse-acp-<platform>
# (.tar.gz, or .zip on Windows) with the binary at the root, so the entry's
# `cmd` is `./muse-acp`. The publish job writes that entry's `binary` block,
# with each archive's URL and sha256, to the run summary.
#
# Linux builds against musl, so one static binary runs on any distribution's
# libc. A tag must match Cargo.toml's version, because the binary reports
# that version to every client it meets.
name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the crate's version
        if: github.ref_type == 'tag'
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml's version $version." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The live test skips itself here: there is no `muse` on the runner.
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          # Intel Macs are built on Apple silicon: GitHub's Intel runner is its
          # slowest, and Rust cross-compiles to x86_64 natively.
          - runner: macos-26
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            cross: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      BIN: ${{ startsWith(matrix.platform, 'windows') && 'muse-acp.exe' || 'muse-acp' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"
      # A binary built for the runner's own machine is run once, so an archive
      # that cannot start is never published.
      - name: Start it
        if: ${{ !matrix.cross }}
        shell: bash
        run: '"target/$TARGET/release/$BIN" --version'
      - name: Gather the archive's files
        shell: bash
        run: |
          mkdir -p pack out
          cp "target/$TARGET/release/$BIN" README.md LICENSE-APACHE LICENSE-MIT pack/
      - name: Pack (tar.gz)
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        run: tar -C pack -czf "out/muse-acp-$PLATFORM.tar.gz" "$BIN" README.md LICENSE-APACHE LICENSE-MIT
      - name: Pack (zip)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: Compress-Archive -Path pack\* -DestinationPath "out\muse-acp-$env:PLATFORM.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: muse-acp-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: muse-acp-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum muse-acp-* > checksums.txt
      # A draft first, published only once every archive is on it, so nobody
      # downloads from a release that is still missing platforms. A published
      # version is never replaced.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "Release $GITHUB_REF_NAME is already published; refusing to replace it." >&2
            exit 1
          fi
          if [ "$state" = "none" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/muse-acp-* dist/checksums.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: The ACP registry entry's binary block
        run: |
          echo '### ACP registry `distribution`' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import hashlib, json, os, pathlib
          tag, repo = os.environ["GITHUB_REF_NAME"], os.environ["GITHUB_REPOSITORY"]
          binary = {}
          for archive in sorted(pathlib.Path("dist").glob("muse-acp-*")):
              platform = archive.name.removeprefix("muse-acp-").removesuffix(".tar.gz").removesuffix(".zip")
              binary[platform] = {
                  "archive": f"https://github.com/{repo}/releases/download/{tag}/{archive.name}",
                  "cmd": "./muse-acp.exe" if platform.startswith("windows") else "./muse-acp",
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              }
          print(json.dumps({"binary": binary}, indent=2))
          EOF
          echo '```' >> "$GITHUB_STEP_SUMMARY"
